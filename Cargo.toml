[package]
name = "peripheral-desk"
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Native Windows mouse controls and battery monitor"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Devices_HumanInterfaceDevice",
  "Win32_Devices_DeviceAndDriverInstallation", "Win32_Storage_FileSystem",
  "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Security",
  "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell",
  "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_System_Registry", "Win32_System_IO", "Win32_UI_Input_KeyboardAndMouse"
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

